name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/images.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run preview -- --port 4173 --strictPort &
      - run: npx wait-on http://127.0.0.1:4173/
      - run: node verify-final.mjs
      - run: node verify-deep.mjs
      - run: node verify-redesign.mjs

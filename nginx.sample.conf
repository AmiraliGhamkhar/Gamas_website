# Gamas — Nginx sample config (parity with public/.htaccess Apache policy)
# ---------------------------------------------------------------------------
# Mirror the Apache security headers when deploying behind Nginx, since
# .htaccess is Apache-only. Replace __GAMAS_SCRIPT_HASHES__ with the exact
# SHA-256 hashes printed by `npm run postbuild` for the current dist/.
#
#   add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' __GAMAS_SCRIPT_HASHES__; script-src-attr 'none'; style-src 'self' __GAMAS_STYLE_HASHES__; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; report-uri /api/csp-report.php; upgrade-insecure-requests" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header X-Frame-Options "DENY" always;
#   add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), midi=()" always;
#   add_header Cross-Origin-Opener-Policy "same-origin" always;
#   add_header Strict-Transport-Security "max-age=15552000" always;
#
# Cache buckets (match .htaccess §5/§7):
#   location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always; }
#   location ^~ /assets/    { add_header Cache-Control "public, max-age=31536000, immutable" always; }
#   location ^~ /fonts/     { add_header Cache-Control "public, max-age=31536000, immutable" always; }
#   location ^~ /images/    { add_header Cache-Control "public, max-age=2592000, must-revalidate" always; }
#
# SPA fallback (never rewrite /api, assets, or real files):
#   location ^~ /api/ { try_files $uri $uri/ =404; }
#   location / { try_files $uri $uri/ /index.html; }

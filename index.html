         the fold, so it was fetched only after the stylesheet parsed. It is
         downloaded on every visit either way; preloading changes when, not how
         much. -->
    <link rel="preload" href="%BASE_URL%fonts/vazirmatn-v16-arabic-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- AVIF matches the first source in the hero picture; unsupported browsers skip it. -->
    <link rel="preload" as="image" href="%BASE_URL%images/hero-phone.avif" type="image/avif" imagesrcset="%BASE_URL%images/hero-phone.avif 941w" imagesizes="(max-width: 639px) 270px, (max-width: 833px) 330px, 430px" fetchpriority="high" />

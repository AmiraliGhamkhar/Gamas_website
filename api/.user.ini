; =============================================================================
;  Gamas — per-directory PHP settings for /api
;  ---------------------------------------------------------------------------
;  Upload this file. It is picked up automatically when PHP runs as CGI/FPM or
;  LSAPI (the cPanel default). If the account uses mod_php/DSO this file is
;  ignored — api/bootstrap.php sets the same values at runtime instead.
;
;  These particular directives are PHP_INI_PERDIR, which is exactly why they
;  CANNOT go in .htaccess and CANNOT be set with ini_set() at runtime.
;
;  cPanel caches .user.ini for ~5 minutes (user_ini.cache_ttl). Wait that long
;  before concluding a change did not take effect.
; =============================================================================

; --- Never show errors to visitors -------------------------------------------
display_errors       = Off
display_startup_errors = Off
html_errors          = Off
log_errors           = On

; --- Keep request bodies tiny: this API only ever takes a few hundred bytes -
; These are PHP_INI_PERDIR, so they cannot be set from PHP code at runtime.
post_max_size        = 64K
upload_max_filesize  = 1K
max_input_vars       = 100

; --- Shared-hosting safety rails --------------------------------------------
max_execution_time   = 20
max_input_time       = 10
memory_limit         = 64M

; --- Session settings (CSRF uses signed cookies, not sessions) --------------
session.auto_start   = 0
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; --- Locale/encoding --------------------------------------------------------
; (mbstring.internal_encoding is intentionally absent: removed in PHP 8.0.
;  bootstrap.php calls mb_internal_encoding() at runtime instead.)
default_charset      = "UTF-8"
date.timezone        = "UTC"
